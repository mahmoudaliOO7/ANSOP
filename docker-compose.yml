version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ansop-postgres
    environment:
      POSTGRES_USER: ansop_user
      POSTGRES_PASSWORD: ansop_password_change_me
      POSTGRES_DB: ansop_db
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansop_user -d ansop_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ansop-network
    restart: unless-stopped

  # Backend FastAPI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ansop-backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_LOG_LEVEL: INFO
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATABASE_URL: postgresql://ansop_user:ansop_password_change_me@postgres:5432/ansop_db
      DATABASE_POOL_SIZE: 20
      DATABASE_MAX_OVERFLOW: 10
      JWT_SECRET_KEY: "your-super-secret-jwt-key-change-me-in-production"
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      LAB_MODE: "true"
      DRY_RUN: "true"
      ALLOW_PRIVATE_TARGETS: "true"
      BLOCK_EXTERNAL_TARGETS: "true"
      TI_PROVIDER_TYPE: mock
      GEO_PROVIDER_TYPE: mock
      LOG_FORMAT: json
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
      ENABLE_API_DOCS: "true"
      API_DOCS_URL: /docs
      REDOC_URL: /redoc
      ENABLE_SECURITY_HEADERS: "true"
      HSTS_MAX_AGE: 31536000
      X_FRAME_OPTIONS: DENY
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ansop-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ansop-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: ANSOP
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ansop-network
    restart: unless-stopped
    command: npm run dev

networks:
  ansop-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
